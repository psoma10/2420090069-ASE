# Isolated in-memory database for the automated tests.
# The DataSeeder is disabled under this profile so each test controls its own data.
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:collegeerp-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false
