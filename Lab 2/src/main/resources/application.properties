spring.application.name=college-erp

# ---------------------------------------------------------------------------
# Default (dev) datasource: in-memory H2 running in MySQL compatibility mode.
# This lets the ERP start and the tests run without a local MySQL server.
# For the MySQL deployment described in PRD section 4, run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:collegeerp;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
