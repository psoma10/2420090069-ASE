name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.lab }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - "Lab 5"
          - "Lab 6"
    defaults:
      run:
        working-directory: ${{ matrix.lab }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter
        run: flake8 .

      - name: Run Tests
        run: pytest

  docker-build:
    name: Docker build and smoke test (Lab 6)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      IMAGE_NAME: docker-demo-app
      CONTAINER_NAME: docker-demo-container
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" "Lab 6"

      - name: Run container
        run: |
          docker run -d --name "$CONTAINER_NAME" -p 5000:5000 "$IMAGE_NAME"

      - name: Wait for application to respond
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000 > /dev/null; then
              echo "Application responded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: application not ready yet, retrying..."
            sleep 2
          done
          echo "Application did not respond within the timeout."
          docker logs "$CONTAINER_NAME" || true
          exit 1

      - name: Verify root endpoint body
        run: |
          body=$(curl -fsS http://localhost:5000)
          echo "Response body: $body"
          case "$body" in
            *"Hello from Docker!"*)
              echo "Root endpoint returned the expected greeting."
              ;;
            *)
              echo "Unexpected response body: $body"
              exit 1
              ;;
          esac

      - name: Verify health endpoint
        run: |
          health=$(curl -fsS http://localhost:5000/health)
          echo "Health body: $health"
          case "$health" in
            *'"status"'*'"ok"'*)
              echo "Health endpoint reported ok."
              ;;
            *)
              echo "Unexpected health response: $health"
              exit 1
              ;;
          esac

      - name: Show container logs
        if: always()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Stop and remove container
        if: always()
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

  k8s-deploy:
    name: Kubernetes Nginx Pod deploy (Lab 7)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      MANIFEST: Lab 7/nginx-pod.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GitHub-hosted runners cannot nest Minikube's Docker driver reliably,
      # so CI uses kind. It is the same single-node Kubernetes API, applied to
      # the identical manifest the lab uses locally with Minikube.
      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: lab7

      - name: Verify the node is Ready
        run: |
          kubectl cluster-info
          kubectl wait --for=condition=Ready node --all --timeout=180s
          kubectl get nodes -o wide

      - name: Validate the manifest
        run: kubectl apply -f "$MANIFEST" --dry-run=server

      - name: Apply the Pod manifest
        run: kubectl apply -f "$MANIFEST"

      - name: Wait for the Pod to reach Running
        run: |
          kubectl wait --for=condition=Ready pod/nginx-pod --timeout=180s
          kubectl get pods -o wide

      - name: Port forward and verify the Nginx welcome page
        run: |
          kubectl port-forward pod/nginx-pod 8080:80 > /dev/null 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080 > /dev/null; then
              echo "Nginx responded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Nginx did not respond within the timeout."
              kubectl describe pod nginx-pod || true
              exit 1
            fi
            echo "Attempt $attempt: Nginx not ready yet, retrying..."
            sleep 2
          done

          body=$(curl -fsS http://localhost:8080)
          case "$body" in
            *"Welcome to nginx"*)
              echo "Received the expected Nginx welcome page."
              ;;
            *)
              echo "Unexpected response body:"
              echo "$body"
              exit 1
              ;;
          esac

      - name: Show Pod logs
        if: always()
        run: kubectl logs nginx-pod || true

      - name: Delete the Pod
        if: always()
        run: kubectl delete -f "$MANIFEST" --ignore-not-found
